services:
  frontend:
    image: paineldecomando-frontend:${IMAGE_TAG:-latest}
    networks:
      - internal
      - traefik_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.paineldecomando.entrypoints=web
        - traefik.http.routers.paineldecomando.rule=Host(`paineldecomando.com.br`) || Host(`www.paineldecomando.com.br`)
        - traefik.http.routers.paineldecomando-root-secure.entrypoints=websecure
        - traefik.http.routers.paineldecomando-root-secure.rule=Host(`paineldecomando.com.br`)
        - traefik.http.routers.paineldecomando-root-secure.service=paineldecomando
        - traefik.http.routers.paineldecomando-root-secure.tls=true
        - traefik.http.routers.paineldecomando-root-secure.tls.certresolver=le
        - traefik.http.routers.paineldecomando-www-secure.entrypoints=websecure
        - traefik.http.routers.paineldecomando-www-secure.rule=Host(`www.paineldecomando.com.br`)
        - traefik.http.routers.paineldecomando-www-secure.service=paineldecomando
        - traefik.http.routers.paineldecomando-www-secure.tls=true
        - traefik.http.services.paineldecomando.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    image: paineldecomando-api:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://paineldecomando.com.br
      FRONTEND_URL: https://paineldecomando.com.br
      CORS_ALLOWED_ORIGINS: https://paineldecomando.com.br,https://www.paineldecomando.com.br
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: painel_de_comando
      DB_USERNAME: painel_app
      DB_PASSWORD_FILE: /run/secrets/paineldecomando_db_password
      LOG_PATH: /var/www/html/storage/logs
    secrets:
      - paineldecomando_db_password
    networks:
      - internal
    volumes:
      - api_logs:/var/www/html/storage/logs
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: painel_de_comando
      MARIADB_USER: painel_app
      MARIADB_PASSWORD_FILE: /run/secrets/paineldecomando_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/paineldecomando_db_root_password
    secrets:
      - paineldecomando_db_password
      - paineldecomando_db_root_password
    networks:
      - internal
    volumes:
      - database:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  internal:
    driver: overlay
  traefik_public:
    external: true

volumes:
  database:
  api_logs:

secrets:
  paineldecomando_db_password:
    external: true
  paineldecomando_db_root_password:
    external: true
